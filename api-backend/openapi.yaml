            schema:
              $ref: '#/components/schemas/ZonaAlmacen'
      responses:
        '201':
          description: Zona creada con éxito
        '400':
          description: Datos invalidos
        '500':
          description: Error interno
  /zonas/{idZona}:
    parameters:
      - name: idZona
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Busca una zona por ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZonaAlmacen'
        '404':
          description: No encontrado
        '500':
          description: Error interno
    put:
      summary: Modifica una zona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZonaAlmacen'
      responses:
        '200':
          description: Modificado
        '400':
          description: Datos invalidos
        '404':
          description: No encontrado
        '500':
          description: Error interno
    delete:
      summary: Elimina una zona
      responses:
        '204':
          description: Eliminado
        '404':
          description: No encontrado
        '500':
          description: Error interno

  #-------------------------------------------------------
  #-------------CATEGORIAS------------
  /categorias:
    get:
      summary: Lista las familias de artículos
      parameters:
        - name: codigoClasificacion
          in: query
          description: Filtrar por código
          required: false
          schema:
            type: string
        - name: prioridadDescarga
          in: query
          description: Filtrar categorías prioritarias (true/false)
          required: false
          schema:
            type: boolean
        - name: nivelPeligrosidad
          in: query
