        '500':
          description: Error interno
    put:
      summary: Modifica una categoría
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Categoria'
      responses:
        '200':
          description: Modificado
        '400':
