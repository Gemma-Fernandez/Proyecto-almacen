
#arhivo definicion api
openapi: 3.0.0
info:
  title: API Almacén Logístico Deportivo
  version: 1.0.0
  description: API para la gestión logística del almacén de material deportivo.

#RUTAS (url para llamar app movil)
paths:

  #-------------------------------------------------------
  #-----------RECEPCION---------------
  /recepciones:
    get:
      summary: Lista todas las recepciones de documentos
      parameters:
        - name: numeroAlbaran
          in: query
          description: Filtrar por número de albarán exacto
          required: false
          schema:
            type: string
        - name: documentacionValidada
          in: query
          description: Filtrar recepciones con documentación correcta (true/false)
          required: false
          schema:
            type: boolean
        - name: fechaRecepcion
          in: query
          description: Filtrar por fecha de recepción
          required: false
          schema:
            type: string
            format: date
      responses:
        '200': #código 200 significa "OK"
          description: Lista recuperada con éxito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecepcionDocumento'
    post:
      summary: Registra una nueva recepción en el muelle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecepcionDocumento'
      responses:
        '201': #significa "creado"
          description: Recepción creada con éxito
        '400':#significa "faltan datos"
          description: Datos inválidos
        '500':
          description: Error interno del servidor
  /recepciones/{idRecepcion}:
    parameters:
      - name: idRecepcion
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Busca una recepción por ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecepcionDocumento'
        '404':
          description: No encontrado
        '500':
          description: Error interno del servidor
    put:
      summary: Modifica una recepción
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecepcionDocumento'
      responses:
        '200':
          description: Modificado con éxito
        '400':
          description: Datos invalidos
        '404':
          description: No encontrado
        '500':
          description: Error interno del servidor
    delete:
      summary: Elimina una recepción
      responses:
        '204':
          description: Eliminado con éxito
        '404':
          description: No encontrado
        '500':
          description: Error interno del servidor

  #-------------------------------------------------------
  #----------------PRODUCTOS---------------
  /productos:
    get:
      summary: Lista todos los productos deportivos del almacén
      parameters:
        - name: sku
          in: query
          description: Filtrar por SKU
          required: false
          schema:
            type: string
        - name: requiereUbicacionSeguridad
          in: query
          description: Filtrar productos de alto valor (true/false)
          required: false
          schema:
            type: boolean
        - name: stockDisponible
          in: query
          description: Filtrar por unidades en stock
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Lista recuperada con éxito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
        '500':
          description: Error interno del servidor
    post:
      summary: Registra un nuevo producto deportivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Producto'
      responses:
        '201':
          description: Producto creado con éxito
        '400':
          description: Datos inválidos
        '500':
          description: Error interno del servidor
  /productos/{idProducto}:
    parameters:
      - name: idProducto
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Busca un producto por ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '404':
          description: No encontrado
        '500':
          description: Error interno del servidor
    put:
      summary: Modifica un producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Producto'
      responses:
        '200':
          description: Modificado
        '400':
          description: Datos invalidos
        '404':
          description: No encontrado
        '500':
          description: Error interno del servidor
    delete:
      summary: Elimina un producto
      responses:
        '204':
          description: Eliminado
        '404':
          description: No encontrado
        '500':
          description: Error interno del servidor

  #-------------------------------------------------------
  #------------OPERARIOS--------------
  /operarios:
    get:
      summary: Lista todo el personal del almacén
      parameters:
        - name: dni
          in: query
          description: Filtrar por DNI
          required: false
          schema:
            type: string
        - name: aptoCarretilla
          in: query
          description: Filtrar operarios con carnet de maquinaria (true/false)
          required: false
          schema:
            type: boolean
        - name: fechaIncorporacion
          in: query
          description: Filtrar por fecha de alta
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista recuperada con éxito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Operario'
        '500':
          description: Error interno
    post:
      summary: Registra un nuevo operario logístico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Operario'
      responses:
        '201':
          description: Operario creado con éxito
        '400':
          description: Datos invalidos
        '500':
          description: Error interno
  /operarios/{idOperario}:
    parameters:
      - name: idOperario
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Busca un operario por ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operario'
        '404':
          description: No encontrado
        '500':
          description: Error interno
    put:
      summary: Modifica un operario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Operario'
      responses:
        '200':
          description: Modificado
        '400':
          description: Datos invalidos
        '404':
          description: No encontrado
        '500':
          description: Error interno
    delete:
      summary: Elimina un operario
      responses:
        '204':
          description: Eliminado
        '404':
          description: No encontrado
        '500':
          description: Error interno

  #-------------------------------------------------------
  #---------------ZONAS---------------
  /zonas:
    get:
      summary: Lista las áreas de la nave logística
      parameters:
        - name: codigoUbicacion
          in: query
          description: Filtrar por código de zona
          required: false
          schema:
