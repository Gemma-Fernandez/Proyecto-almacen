#MODELOS DE DATOS
#estructura de las 5 clases
components:
  schemas:
    RecepcionDocumento:
      type: object
      required: #nunca se pueden dejar en blanco
        - numeroAlbaran
        - fechaRecepcion
      properties:
        idRecepcion:
          type: integer
        numeroAlbaran:
          type: string
          pattern: '^ALB-\d{4}-\d{4}$' #obliga a que empiece por ALB
        fechaRecepcion:
          type: string
          format: date
        bultosDeclarados:
          type: integer
        desviacionPeso:
          type: number
          format: float
        documentacionValidada:
          type: boolean

    Producto:
      type: object
      required:
        - sku
        - nombreArticulo
      properties:
        idProducto:
          type: integer
        sku:
          type: string
          pattern: '^[A-Z0-9]{10}$'
        nombreArticulo:
          type: string
        pesoUnitarioKg:
          type: number
          format: float
        stockDisponible:
          type: integer
        requiereUbicacionSeguridad:
          type: boolean
        fechaAlta:
          type: string
          format: date

    Operario:
      type: object
      required:
        - dni
        - nombreCompleto
      properties:
        idOperario:
          type: integer
        dni:
          type: string
          pattern: '^\d{8}[A-Z]$'
        nombreCompleto:
          type: string
        salarioHora:
          type: number
          format: float
        aptoCarretilla:
          type: boolean
        fechaIncorporacion:
          type: string
          format: date

    ZonaAlmacen:
      type: object
      required:
        - codigoUbicacion
        - responsableArea
      properties:
        idZona:
          type: integer
        codigoUbicacion:
          type: string
          pattern: '^Z-\d{3}$'
        responsableArea:
          type: string
        capacidadPallets:
          type: integer
        temperaturaMedia:
          type: number
          format: float
        requiereEpis:
          type: boolean
        fechaUltimaRevision:
          type: string
          format: date

    Categoria:
      type: object
      required:
        - codigoClasificacion
        - nombreFamilia
      properties:
        idCategoria:
          type: integer
        codigoClasificacion:
          type: string
          pattern: '^[A-Z]{5}$'
        nombreFamilia:
          type: string
        nivelPeligrosidad:
          type: integer
        margenRotura:
          type: number
          format: float
        prioridadDescarga:
          type: boolean
        fechaCreacion:
          type: string
          format: date